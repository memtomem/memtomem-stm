[project]
name = "memtomem-stm"
version = "0.2.0"
description = "Short-term memory proxy gateway with proactive memory surfacing for AI agents"
authors = [
    {name = "DAPADA Inc.", email = "contact@dapada.co.kr"},
    {name = "memtomem contributors"},
]
license = {text = "Apache-2.0"}
keywords = ["memory", "ai", "mcp", "proxy", "gateway", "agent", "caching", "compression"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Security floors for transitive dependencies pinned to patched versions; see #673.
    "cryptography>=48.0.1",
    "idna>=3.15",
    "pyjwt>=2.13.0",
    "python-multipart>=0.0.31",
    "starlette>=1.3.1",
    # Floor at 2.0: the proxy builds on ``mcp.server.mcpserver`` (including
    # ``utilities.func_metadata`` internals) and ``streamable_http_client``,
    # neither of which exists in 1.x. The SDK offers no dual-version shim, so
    # the floor is hard — an environment on 1.x must upgrade memtomem and
    # memtomem-stm together (#801). Capped below 3.0 because the passthrough
    # shim in ``proxy/_fastmcp_compat.py`` rides SDK internals: a major
    # deserves a deliberate look, not a silent resolve.
    "mcp[cli]>=2.0.0,<3",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "httpx>=0.28",
    # The 2.0 SDK moved its own HTTP client to ``httpx2``. We import it
    # directly — to build the ``AsyncClient`` that carries upstream headers
    # and timeouts into ``streamable_http_client``, and to classify its
    # transport errors as retryable — so it is declared rather than borrowed
    # transitively. ``httpx`` stays: this package's own HTTP calls use it.
    "httpx2>=2.5.0",
    "click>=8.1",
    "questionary>=2.0",
    "tomli-w>=1.0",
]

[project.optional-dependencies]
langfuse = ["langfuse>=4.0", "urllib3>=2.7.0"]
# OTLP span export (#789 stage 2). HTTP/protobuf exporter only — the gRPC
# exporter pulls grpcio, whose wheels are the Windows/py3.12 pain point and
# CI runs the suite there too.
otlp = [
    "opentelemetry-sdk>=1.30",
    "opentelemetry-exporter-otlp-proto-http>=1.30",
    "urllib3>=2.7.0",
]
langchain = [
    "langchain>=1.0",
    # >=0.3 so the resolver cannot pick an adapter release that predates the
    # mcp 2.0 SDK this package now requires.
    "langchain-mcp-adapters>=0.3",
    "langchain-anthropic>=0.3",
    "langsmith>=0.8.18",
    "urllib3>=2.7.0",
]

[project.scripts]
# All three entry points resolve to the same Click group. The group's
# ``invoke_without_command=True`` callback dispatches bare invocations to
# ``server.main`` when stdin isn't a TTY (the MCP-client stdio case),
# otherwise prints help — so registering any of these three names in an
# MCP client's config works identically. See #260.
memtomem-stm = "memtomem_stm.cli.proxy:cli"
memtomem-stm-proxy = "memtomem_stm.cli.proxy:cli"
mms = "memtomem_stm.cli.proxy:cli"

[project.urls]
Homepage = "https://github.com/memtomem/memtomem-stm"
Repository = "https://github.com/memtomem/memtomem-stm"
Issues = "https://github.com/memtomem/memtomem-stm/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memtomem_stm"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "ruff>=0.9",
    "mypy>=1.14",
    "jupyter>=1.1",
    "ipykernel>=6.29",
    "nbclient>=0.10",
    "nbmake>=1.5",
    # Exercised by tests/test_observability_otlp.py via an in-memory span
    # exporter — no network. Mirrors the `otlp` extra.
    "opentelemetry-sdk>=1.30",
    "opentelemetry-exporter-otlp-proto-http>=1.30",
    # tests/test_docs_links.py parses the public docs with a real CommonMark
    # parser instead of hand-rolling one. Declared rather than leaned on as
    # rich's transitive dependency, which could drop it at any release.
    "markdown-it-py>=3.0",
]
audit = ["pip-audit==2.10.1"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "bench_qa: end-to-end compression/surfacing regression gate (fake upstream, deterministic)",
    "bench_qa_meta: self-test probes for bench_qa — intentional failures, NOT CI-safe",
    "bench_qa_llm_judge: LLM-as-judge advisory scoring — requires OPENAI_API_KEY or ANTHROPIC_API_KEY, off in default CI",
    "bench_qa_sweep: measurement runs that emit curve artifacts; off in default and advisory CI, invoked manually",
    "bench_qa_drift: cross-version snapshot drift gate vs committed drift_baseline.json; advisory until promoted (regen with tests/bench/bench_qa/regen_drift_baseline.py)",
    "bench_qa_perf: per-call latency regression gate (median-of-N total_ms, in-run NONE-compression relative anchor, absolute+relative dual assertion); advisory until promoted, off in default and required CI",
    "real_child_sweep: opts out of the autouse stub so the test sees this process's real direct children",
    "real_client_activity: opts out of the autouse stub so the test pins the real handler-registry wrapping",
]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
ignore_missing_imports = true
disable_error_code = ["has-type"]
