name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege baseline (#609). Jobs that need more declare their own
# block (job-level permissions fully replace this one — see
# bench_qa_pr_comment's pull-requests:write).
permissions:
  contents: read

jobs:
  # Windows runs on lint/typecheck/test are gating required checks alongside
  # ubuntu-latest. The matrix was introduced in #304 (P1a) with a
  # `continue-on-error` escape hatch while the #302 Windows-support triage
  # was in flight; with #314–#319 merged the matrix is consistently green
  # so the escape hatch is gone. The mypy step was advisory
  # (`continue-on-error: true`) until the #617 burn-down reached 0 errors
  # on every platform; it now gates like lint and test.
  lint:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0
        with:
          version: "latest"
      - run: uv sync --frozen
      - run: uv run ruff check src
      - run: uv run ruff format --check src

  typecheck:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0
        with:
          version: "latest"
      - run: uv sync --frozen
      - name: mypy
        run: uv run mypy src

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0
        with:
          version: "latest"
      - run: uv sync --frozen
      - run: uv run pytest -m "not ollama and not bench_qa_meta and not bench_qa_llm_judge and not bench_qa_sweep and not bench_qa_drift and not bench_qa_perf" --tb=short -q

  notebooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0
        with:
          version: "latest"
      - run: uv sync --frozen
      - name: Run tutorial notebook
        run: |
          uv run pytest --nbmake \
            notebooks/01_quickstart_proxy_setup.ipynb \
            --nbmake-timeout=180 --tb=short -q

  audit:
    # ADVISORY dependency vulnerability audit (#609). Exports the locked
    # dependency set (uv.lock, all groups) and runs pip-audit against it.
    # Step-level continue-on-error (the convention mypy used during its
    # advisory phase, pre-#617) keeps the findings in the job log without
    # a red check on every PR while the baseline is being cleaned (50 known
    # vulns in transitive dev deps at introduction time). Promote to
    # required (drop the flag + branch protection) once Dependabot has
    # cleaned the baseline.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0
        with:
          version: "latest"
      - name: Export locked requirements
        run: uv export --frozen --no-emit-project -o requirements-audit.txt
      - name: pip-audit (advisory)
        run: uvx pip-audit -r requirements-audit.txt --disable-pip
        continue-on-error: true

  bench_qa:
    # Required gate. Per-scenario floors (qa_gate_min, ratio_violation) are
    # hard-asserted at the pytest level and were ratcheted up from observed
    # data over a multi-week advisory period (2026-04..06). The floors live
    # in tests/bench/fixtures/<scenario>.json; the suite is deterministic
    # (fake upstream, no network/LLM — the LLM judge runs under a separate
    # opt-in marker). A failure here now blocks merge: it signals a real
    # compression/surfacing regression, so adjust the code or, if the new
    # behaviour is intended, re-baseline the affected fixture's floor.
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0
        with:
          version: "latest"
      - run: uv sync --frozen
      - name: Run bench_qa suite
        env:
          BENCH_QA_REPORT_DIR: ${{ github.workspace }}/bench-qa-report
        run: uv run pytest -m "bench_qa and not bench_qa_sweep" --tb=short -q
      - name: Upload bench_qa report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bench-qa-report
          path: bench-qa-report/
          if-no-files-found: warn
          retention-days: 14

  bench_qa_pr_comment:
    # Surface the bench_qa summary.md table as a sticky PR comment (item 5 of
    # the post-gate roadmap). Deliberately a *separate* job from the required
    # bench_qa gate so that (a) pull-requests:write is scoped to this job only,
    # keeping the gate least-privilege, and (b) a comment failure can never
    # turn the required check red. Runs even when the gate fails (always() +
    # needs) so reviewers still see the table on a regression. Skipped on push
    # and on fork PRs, whose GITHUB_TOKEN is read-only and cannot comment.
    needs: bench_qa
    if: >-
      always() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Download bench_qa report
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: bench-qa-report
          path: bench-qa-report
      - name: Upsert sticky summary comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          MARKER='<!-- bench-qa-summary -->'
          FILE=bench-qa-report/summary.md
          if [ ! -f "$FILE" ]; then
            echo "no summary.md in artifact; nothing to post"
            exit 0
          fi
          { printf '%s\n\n' "$MARKER"; cat "$FILE"; } > body.md
          CID="$(gh api --paginate "repos/$REPO/issues/$PR_NUMBER/comments" \
                  --jq 'map(select((.body // "") | startswith("'"$MARKER"'"))) | .[0].id // empty')"
          if [ -n "$CID" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$CID" -F body=@body.md >/dev/null
            echo "updated sticky bench_qa comment ($CID)"
          else
            gh api -X POST "repos/$REPO/issues/$PR_NUMBER/comments" -F body=@body.md >/dev/null
            echo "created sticky bench_qa comment"
          fi

  bench_qa_drift:
    # ADVISORY cross-version drift gate (post-gate roadmap item 8). Pins the
    # whole canonical report.json to tests/bench/fixtures/drift_baseline.json so
    # a metric sliding the wrong way across PRs — even while still above its
    # per-scenario floor — must pass through a reviewed baseline diff. The
    # per-PR `bench_qa` gate only enforces absolute floors and cannot see a slow
    # slide between them. Self-contained: the test rebuilds the report in-process
    # from fixtures (no dependency on the bench-qa-report artifact). continue-on-
    # error keeps it non-blocking; promote to required (flip to false + add to
    # branch-protection) after an observation window, mirroring #482.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0
        with:
          version: "latest"
      - run: uv sync --frozen
      - name: Run bench_qa drift gate
        env:
          BENCH_QA_REPORT_DIR: ${{ github.workspace }}/bench-qa-drift-report
        run: uv run pytest -m "bench_qa_drift" --tb=short -q
      - name: Upload drift report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bench-qa-drift-report
          path: bench-qa-drift-report/
          if-no-files-found: ignore
          retention-days: 14

  bench_qa_perf:
    # ADVISORY per-call latency regression gate (post-gate roadmap item 6).
    # Drives the real ProxyManager.call_tool pipeline N times per fixture and
    # gates the MEDIAN total_ms with a dual assertion: an absolute ceiling
    # ("everything got slower") plus a relative bound against an in-run
    # NONE-compression run on the same bytes (machine-invariant — isolates
    # compression cost from CPU speed; replaces a fake-sleep baseline). This is
    # the one bench_qa surface that is wall-clock-bound, so it cannot be a
    # snapshot gate and must observe a real-fleet baseline before blocking. The
    # marker is excluded from the required `test` and `bench_qa` jobs; perf
    # numbers land in sweep_perf.json (not report.json), so the determinism
    # (#486) and drift (#487) gates never see them. continue-on-error keeps it
    # non-blocking; promote to required (flip to false + branch protection)
    # after an observation window, mirroring #482.
    #
    # NB: the pytest -m filter here must NOT contain "not ollama" — the
    # docs-sync test (test_contributing_pytest_command_matches_ci) requires
    # exactly one such filter (the `test` job's); a second would red it.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0
        with:
          version: "latest"
      - run: uv sync --frozen
      - name: Run bench_qa perf gate
        env:
          BENCH_QA_REPORT_DIR: ${{ github.workspace }}/bench-qa-perf-report
        run: uv run pytest -m "bench_qa_perf" --tb=short -q
      - name: Upload perf report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bench-qa-perf-report
          path: bench-qa-perf-report/
          if-no-files-found: ignore
          retention-days: 14
