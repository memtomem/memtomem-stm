name: Core compatibility advisory

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stdio-smoke:
    name: memtomem ${{ matrix.core }} (${{ matrix.expected }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # ``mcp_pin`` exists because Core 0.3.x imports mcp.server.fastmcp,
          # which mcp 2.x removed, while declaring no upper bound of its own.
          # A newly added row must NOT inherit it: leave mcp_pin empty so a Core
          # that caps mcp itself resolves on its own, and a Core that needs
          # mcp>=2 is not held back by a pin it never asked for.
          - core: "0.3.8"
            expected: legacy
            mcp_pin: "mcp<2"
          - core: "0.3.9"
            expected: schema2
            mcp_pin: "mcp<2"
          - core: "0.3.10"
            expected: schema3
            mcp_pin: "mcp<2"
          - core: "0.3.12"
            expected: schema4
            mcp_pin: "mcp<2"
          - core: "0.3.13"
            expected: schema4
            mcp_pin: "mcp<2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.16"
      - run: uv sync --frozen
      - name: Install exact core release
        env:
          CORE_VERSION: ${{ matrix.core }}
          MCP_PIN: ${{ matrix.mcp_pin }}
        run: |
          uv venv --python 3.12 "$RUNNER_TEMP/core"
          # shellcheck disable=SC2086 # an empty MCP_PIN must expand to no argument
          uv pip install --python "$RUNNER_TEMP/core/bin/python" \
            "memtomem==$CORE_VERSION" ${MCP_PIN:+"$MCP_PIN"}
      - name: Report whether this row still needs its mcp pin
        if: ${{ matrix.mcp_pin != '' }}
        env:
          MCP_PIN: ${{ matrix.mcp_pin }}
        run: |
          # Read Core's own requirement from its venv (stdlib only — packaging is
          # not guaranteed there; 0.3.10 has none), then judge it in STM's venv,
          # whose packaging is pinned by the frozen lock.
          {
            "$RUNNER_TEMP/core/bin/python" -c \
              'import sys; print(".".join(str(p) for p in sys.version_info[:3]))'
            "$RUNNER_TEMP/core/bin/python" -c \
              'import importlib.metadata as m; print("\n".join(m.requires("memtomem") or ()))'
          } > "$RUNNER_TEMP/core-requires.txt"
          uv run python - "$RUNNER_TEMP/core-requires.txt" <<'PY'
          import os
          import sys

          from packaging.requirements import Requirement
          from packaging.version import Version

          def _series_end(version: Version, components: int | None = None) -> Version:
              """First version above the series ``version`` describes.

              The epoch has to be carried through. ``Version.release`` drops it,
              and every epoch-1 version sorts above every epoch-0 one, so
              rebuilding from the release tuple alone would certify ``==1!0.*``
              as capped below ``2`` while ``1!0.1`` satisfies it.
              """
              parts = list(version.release[:components] if components else version.release) or [0]
              parts[-1] += 1
              tail = ".".join(str(part) for part in parts)
              return Version(f"{version.epoch}!{tail}")

          pin_spec = Requirement(os.environ["MCP_PIN"]).specifier
          core_python, _, raw = open(sys.argv[1], encoding="utf-8").read().partition("\n")

          declared = []
          for line in raw.splitlines():
              if not line.strip():
                  continue
              try:
                  requirement = Requirement(line)
              except Exception:  # a shape packaging cannot parse
                  continue
              if requirement.name.lower() != "mcp":
                  continue
              # Evaluate in the CORE venv's environment, and with no extra: the
              # install step requests no extras, so an `extra == "..."` guarded
              # requirement is not active and must not be judged. Both python
              # fields are supplied — packaging would otherwise fill the one we
              # omit from *this* interpreter, which is not the one Core runs on.
              if requirement.marker is not None and not requirement.marker.evaluate(
                  {
                      "python_version": ".".join(core_python.split(".")[:2]),
                      "python_full_version": core_python,
                      "extra": "",
                  }
              ):
                  continue
              declared.append(requirement)

          # The pin excludes an open-ended range, so no finite set of sample
          # versions can prove Core already excludes it: `mcp<2.1,!=2.0.0`
          # rejects every plausible sample yet still admits 2.0.1. packaging has
          # no SpecifierSet subset test, so prove a *sufficient* condition
          # instead — one active specifier whose accepted set provably ends at
          # or below the pin's boundary. Anything this cannot prove keeps the
          # pin. That direction matters: a missed notice costs a stale hint, a
          # wrong notice removes a pin the build still needs.
          boundaries = [s.version for s in pin_spec if s.operator in ("<", "<=")]
          assert boundaries, f"mcp_pin {os.environ['MCP_PIN']!r} declares no upper bound"
          boundary = Version(boundaries[0])

          def caps_below(specifier) -> bool:
              operator, raw_version = specifier.operator, specifier.version
              if operator == "<":
                  return Version(raw_version) <= boundary
              if operator == "<=":
                  return Version(raw_version) < boundary
              if operator == "==" and not raw_version.endswith(".*"):
                  return Version(raw_version) < boundary
              if operator in ("==", "~=") and raw_version.endswith(".*"):
                  return _series_end(Version(raw_version[:-2])) <= boundary
              if operator == "~=":
                  # ``~=X.Y`` means ``>=X.Y, ==X.*`` — one component shorter.
                  parsed = Version(raw_version)
                  return _series_end(parsed, len(parsed.release) - 1) <= boundary
              return False

          redundant = any(caps_below(s) for r in declared for s in r.specifier)
          if redundant:
              print(f"::notice::Core now caps mcp itself ({declared}); drop mcp_pin for this row")
          else:
              print(f"{os.environ['MCP_PIN']} still required; Core declares {declared or 'nothing'}")
          PY
      - name: Run stdio capability smoke
        env:
          EXPECTED: ${{ matrix.expected }}
        run: >-
          uv run python scripts/core_compat_smoke.py
          --core-bin-dir "$RUNNER_TEMP/core/bin"
          --expect "$EXPECTED"
