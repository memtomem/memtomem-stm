name: Core compatibility advisory

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stdio-smoke:
    name: memtomem ${{ matrix.core }} (${{ matrix.expected }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # ``mcp_pin`` exists because Core 0.3.13 and earlier import
          # mcp.server.fastmcp, which mcp 2.x removed, while declaring no upper
          # bound of their own. Those rows keep the pin even though STM itself
          # now runs on mcp 2.x: the pin applies to the *Core* venv
          # ($RUNNER_TEMP/core), a separate process STM talks to over the MCP
          # protocol, so the two SDK majors never share an interpreter here.
          # A newly added row must NOT inherit it: leave mcp_pin empty so a Core
          # that caps mcp itself resolves on its own, and a Core that needs
          # mcp>=2 is not held back by a pin it never asked for.
          - core: "0.3.8"
            expected: legacy
            mcp_pin: "mcp<2"
          - core: "0.3.9"
            expected: schema2
            mcp_pin: "mcp<2"
          - core: "0.3.10"
            expected: schema3
            mcp_pin: "mcp<2"
          - core: "0.3.12"
            expected: schema4
            mcp_pin: "mcp<2"
          - core: "0.3.13"
            expected: schema4
            mcp_pin: "mcp<2"
          # 0.3.14 caps mcp below 2.0 itself, so no pin is needed — the
          # "still needs its mcp pin" probe below is what surfaced that.
          - core: "0.3.14"
            expected: schema4
            mcp_pin: ""
          # The first mcp-2.x Core (0.4.0) gets its row when it publishes;
          # adding it before the artifact exists only reddens this job.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.16"
      - run: uv sync --frozen
      - name: Install exact core release
        env:
          CORE_VERSION: ${{ matrix.core }}
          MCP_PIN: ${{ matrix.mcp_pin }}
        run: |
          uv venv --python 3.12 "$RUNNER_TEMP/core"
          # shellcheck disable=SC2086 # an empty MCP_PIN must expand to no argument
          uv pip install --python "$RUNNER_TEMP/core/bin/python" \
            "memtomem==$CORE_VERSION" ${MCP_PIN:+"$MCP_PIN"}
      - name: Report whether this row still needs its mcp pin
        if: ${{ matrix.mcp_pin != '' }}
        env:
          MCP_PIN: ${{ matrix.mcp_pin }}
        run: |
          # Read Core's own requirement from its venv (stdlib only — packaging
          # is not guaranteed there; 0.3.10 has none), then judge it with the
          # tracked helper, which is unit-tested in tests/test_docs_sync.py.
          {
            "$RUNNER_TEMP/core/bin/python" -c \
              'import sys; print(".".join(str(p) for p in sys.version_info[:3]))'
            "$RUNNER_TEMP/core/bin/python" -c \
              'import importlib.metadata as m; print("\n".join(m.requires("memtomem") or ()))'
          } > "$RUNNER_TEMP/core-requires.txt"
          uv run python scripts/core_compat_smoke.py \
            --check-mcp-pin "$MCP_PIN" \
            --core-requires "$RUNNER_TEMP/core-requires.txt"
      - name: Run stdio capability smoke
        env:
          EXPECTED: ${{ matrix.expected }}
        run: >-
          uv run python scripts/core_compat_smoke.py
          --core-bin-dir "$RUNNER_TEMP/core/bin"
          --expect "$EXPECTED"
