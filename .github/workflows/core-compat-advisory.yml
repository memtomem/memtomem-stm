name: Core compatibility advisory

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stdio-smoke:
    name: memtomem ${{ matrix.core }} (${{ matrix.expected }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # ``mcp_pin`` exists because Core 0.3.x imports mcp.server.fastmcp,
          # which mcp 2.x removed, while declaring no upper bound of its own.
          # A newly added row must NOT inherit it: leave mcp_pin empty so a Core
          # that caps mcp itself resolves on its own, and a Core that needs
          # mcp>=2 is not held back by a pin it never asked for.
          - core: "0.3.8"
            expected: legacy
            mcp_pin: "mcp<2"
          - core: "0.3.9"
            expected: schema2
            mcp_pin: "mcp<2"
          - core: "0.3.10"
            expected: schema3
            mcp_pin: "mcp<2"
          - core: "0.3.12"
            expected: schema4
            mcp_pin: "mcp<2"
          - core: "0.3.13"
            expected: schema4
            mcp_pin: "mcp<2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.16"
      - run: uv sync --frozen
      - name: Install exact core release
        env:
          CORE_VERSION: ${{ matrix.core }}
          MCP_PIN: ${{ matrix.mcp_pin }}
        run: |
          uv venv --python 3.12 "$RUNNER_TEMP/core"
          # shellcheck disable=SC2086 # an empty MCP_PIN must expand to no argument
          uv pip install --python "$RUNNER_TEMP/core/bin/python" \
            "memtomem==$CORE_VERSION" ${MCP_PIN:+"$MCP_PIN"}
      - name: Report whether this row still needs its mcp pin
        if: ${{ matrix.mcp_pin != '' }}
        env:
          MCP_PIN: ${{ matrix.mcp_pin }}
        run: |
          # Read Core's own requirement from its venv (stdlib only — packaging is
          # not guaranteed there; 0.3.10 has none), then judge it in STM's venv,
          # whose packaging is pinned by the frozen lock.
          {
            "$RUNNER_TEMP/core/bin/python" -c \
              'import sys; print(".".join(str(p) for p in sys.version_info[:3]))'
            "$RUNNER_TEMP/core/bin/python" -c \
              'import importlib.metadata as m; print("\n".join(m.requires("memtomem") or ()))'
          } > "$RUNNER_TEMP/core-requires.txt"
          uv run python - "$RUNNER_TEMP/core-requires.txt" <<'PY'
          import os
          import sys

          from packaging.requirements import Requirement
          from packaging.version import Version

          pin_spec = Requirement(os.environ["MCP_PIN"]).specifier
          core_python, _, raw = open(sys.argv[1], encoding="utf-8").read().partition("\n")

          declared = []
          for line in raw.splitlines():
              if not line.strip():
                  continue
              try:
                  requirement = Requirement(line)
              except Exception:  # a shape packaging cannot parse
                  continue
              if requirement.name.lower() != "mcp":
                  continue
              # Evaluate in the CORE venv's environment, and with no extra: the
              # install step requests no extras, so an `extra == "..."` guarded
              # requirement is not active and must not be judged.
              if requirement.marker is not None and not requirement.marker.evaluate(
                  {"python_version": ".".join(core_python.split(".")[:2]), "extra": ""}
              ):
                  continue
              declared.append(requirement)

          # The pin excludes an open-ended range, not one version, so membership
          # of a single boundary is not enough: `mcp!=2` rejects the boundary yet
          # still admits 3.x. Probe several versions the pin rejects and require
          # Core to reject every one of them. (packaging 26.0 in the frozen lock
          # has no SpecifierSet.is_subset, which would express this directly.)
          probes = [v for v in ("2.0.0", "2.99.99", "3.0.0", "99.0.0") if v not in pin_spec]
          assert probes, f"mcp_pin {os.environ['MCP_PIN']!r} rejects none of the probe versions"
          redundant = declared and all(
              Version(probe) not in requirement.specifier
              for requirement in declared
              for probe in probes
          )
          if redundant:
              print(f"::notice::Core now caps mcp itself ({declared}); drop mcp_pin for this row")
          else:
              print(f"{os.environ['MCP_PIN']} still required; Core declares {declared or 'nothing'}")
          PY
      - name: Run stdio capability smoke
        env:
          EXPECTED: ${{ matrix.expected }}
        run: >-
          uv run python scripts/core_compat_smoke.py
          --core-bin-dir "$RUNNER_TEMP/core/bin"
          --expect "$EXPECTED"
