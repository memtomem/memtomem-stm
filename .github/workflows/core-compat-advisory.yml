name: Core compatibility advisory

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stdio-smoke:
    name: memtomem ${{ matrix.core }} (${{ matrix.expected }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # ``mcp_pin`` exists because Core 0.3.13 and earlier import
          # mcp.server.fastmcp, which mcp 2.x removed, while declaring no upper
          # bound of their own. Those rows keep the pin even though STM itself
          # now runs on mcp 2.x: the pin applies to the *Core* venv
          # ($RUNNER_TEMP/core), a separate process STM talks to over the MCP
          # protocol, so the two SDK majors never share an interpreter here.
          # A newly added row must NOT inherit it: leave mcp_pin empty so a Core
          # that caps mcp itself resolves on its own, and a Core that needs
          # mcp>=2 is not held back by a pin it never asked for.
          - core: "0.3.8"
            expected: legacy
            mcp_pin: "mcp<2"
          - core: "0.3.9"
            expected: schema2
            mcp_pin: "mcp<2"
          - core: "0.3.10"
            expected: schema3
            mcp_pin: "mcp<2"
          - core: "0.3.12"
            expected: schema4
            mcp_pin: "mcp<2"
          - core: "0.3.13"
            expected: schema4
            mcp_pin: "mcp<2"
          # 0.3.14 caps mcp below 2.0 itself, so no pin is needed — the
          # "still needs its mcp pin" probe below is what surfaced that.
          - core: "0.3.14"
            expected: schema4
            mcp_pin: ""
          # 0.4.0 is the first mcp-2.x Core and the lockstep partner of STM
          # 0.2.0. Its row lands with that release; until 0.4.0 is on PyPI the
          # install step cannot resolve and this row alone reds (fail-fast is
          # off). Its capability surface is unchanged from 0.3.14 — Core's
          # advertisement still reads context_compose schema_version 4 — so it
          # expects schema4, and it caps mcp itself, so no pin.
          - core: "0.4.0"
            expected: schema4
            mcp_pin: ""
          # 0.5.0 changes no capability STM negotiates: its breaking changes are
          # CLI (`mm init -y`), a removed `mem_context_migrate` alias, and the
          # chunk-id project boundary (#2238). STM calls none of the read-by-id
          # surfaces that boundary re-scopes (mem_read, mem_expand,
          # mem_related/link/unlink, agent_share, edit/delete, the chunks
          # resource, the web routes). The one id-taking call it does make,
          # `mem_do(increment_access)`, is boundary-checked too — 0.5.0 drops
          # ids outside the caller's project, since boosting a foreign chunk is
          # a write to it — but STM only ever sends back ids that same server
          # answered with, from the same project context, so none are dropped.
          # Its advertisement still reads context_compose schema_version 4, and
          # it caps mcp itself (`mcp[cli]>=2.0.0,<3`), so no pin.
          - core: "0.5.0"
            expected: schema4
            mcp_pin: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.16"
      - run: uv sync --frozen
      - name: Install exact core release
        env:
          CORE_VERSION: ${{ matrix.core }}
          MCP_PIN: ${{ matrix.mcp_pin }}
        run: |
          uv venv --python 3.12 "$RUNNER_TEMP/core"
          # shellcheck disable=SC2086 # an empty MCP_PIN must expand to no argument
          uv pip install --python "$RUNNER_TEMP/core/bin/python" \
            "memtomem==$CORE_VERSION" ${MCP_PIN:+"$MCP_PIN"}
      - name: Report whether this row still needs its mcp pin
        if: ${{ matrix.mcp_pin != '' }}
        env:
          MCP_PIN: ${{ matrix.mcp_pin }}
        run: |
          # Read Core's own requirement from its venv (stdlib only — packaging
          # is not guaranteed there; 0.3.10 has none), then judge it with the
          # tracked helper, which is unit-tested in tests/test_docs_sync.py.
          {
            "$RUNNER_TEMP/core/bin/python" -c \
              'import sys; print(".".join(str(p) for p in sys.version_info[:3]))'
            "$RUNNER_TEMP/core/bin/python" -c \
              'import importlib.metadata as m; print("\n".join(m.requires("memtomem") or ()))'
          } > "$RUNNER_TEMP/core-requires.txt"
          uv run python scripts/core_compat_smoke.py \
            --check-mcp-pin "$MCP_PIN" \
            --core-requires "$RUNNER_TEMP/core-requires.txt"
      - name: Run stdio capability smoke
        env:
          EXPECTED: ${{ matrix.expected }}
        run: >-
          uv run python scripts/core_compat_smoke.py
          --core-bin-dir "$RUNNER_TEMP/core/bin"
          --expect "$EXPECTED"
