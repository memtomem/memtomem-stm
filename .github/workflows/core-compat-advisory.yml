name: Core compatibility advisory

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stdio-smoke:
    name: memtomem ${{ matrix.core }} (${{ matrix.expected }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - core: "0.3.8"
            expected: legacy
          - core: "0.3.9"
            expected: schema2
          - core: "0.3.10"
            expected: schema3
          - core: "0.3.12"
            expected: schema4
          - core: "0.3.13"
            expected: schema4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.16"
      - run: uv sync --frozen
      - name: Install exact core release
        env:
          CORE_VERSION: ${{ matrix.core }}
        run: |
          uv venv --python 3.12 "$RUNNER_TEMP/core"
          # Core 0.3.x imports mcp.server.fastmcp, which mcp 2.x removed, and
          # its own metadata declares no upper bound. Pin the compatible family
          # here; the next step reports when Core makes the pin redundant.
          uv pip install --python "$RUNNER_TEMP/core/bin/python" \
            "memtomem==$CORE_VERSION" "mcp<2"
      - name: Report whether the mcp<2 pin is still needed
        run: |
          "$RUNNER_TEMP/core/bin/python" - <<'PY'
          import importlib.metadata as md

          required = [r for r in md.requires("memtomem") or () if r.lower().startswith("mcp")]
          capped = [r for r in required if "<" in r]
          if capped:
              print(f"::notice::Core now caps mcp ({capped}); drop the mcp<2 pin in this workflow")
          else:
              print(f"mcp<2 pin still required; Core declares {required}")
          PY
      - name: Run stdio capability smoke
        env:
          EXPECTED: ${{ matrix.expected }}
        run: >-
          uv run python scripts/core_compat_smoke.py
          --core-bin-dir "$RUNNER_TEMP/core/bin"
          --expect "$EXPECTED"
