name: Core compatibility advisory

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stdio-smoke:
    name: memtomem ${{ matrix.core }} (${{ matrix.expected }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - core: "0.3.8"
            expected: legacy
          - core: "0.3.9"
            expected: enhanced
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.16"
      - run: uv sync --frozen
      - name: Install exact core release
        id: core
        env:
          CORE_VERSION: ${{ matrix.core }}
          EXPECTED: ${{ matrix.expected }}
        run: |
          set +e
          uv venv --python 3.12 "$RUNNER_TEMP/core"
          uv pip install --python "$RUNNER_TEMP/core/bin/python" "memtomem==$CORE_VERSION"
          status=$?
          set -e
          if [ "$status" -ne 0 ] && [ "$EXPECTED" = "enhanced" ]; then
            echo "::notice::memtomem==$CORE_VERSION is not published yet; enhanced advisory skipped"
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          exit "$status"
      - name: Run stdio capability smoke
        if: steps.core.outputs.available != 'false'
        env:
          EXPECTED: ${{ matrix.expected }}
        run: >-
          uv run python scripts/core_compat_smoke.py
          --core-bin-dir "$RUNNER_TEMP/core/bin"
          --expect "$EXPECTED"
