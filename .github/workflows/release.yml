name: Publish

# Publishes the memtomem-stm distribution to PyPI (or TestPyPI for dry-runs)
# via PyPI Trusted Publishers (OIDC). No API tokens are stored.
#
# Tag conventions:
#   v0.1.0          → PyPI                (production)
#   test-v0.1.0a1   → TestPyPI            (dry run)
#
# Both paths share the same `pypi` GitHub environment, gated to tag
# pushes matching `v*` and `test-v*` only.
#
# Build and publish run in a single job — actions/upload-artifact@v4
# scopes artifacts per run-attempt, so a partial rerun cannot reuse the
# previous attempt's build artifact. Keeping everything in one job means
# every (re)run rebuilds locally and avoids the cross-attempt artifact
# lookup entirely.

on:
  push:
    tags:
      - "v[0-9]*"        # production
      - "test-v[0-9]*"   # TestPyPI dry-run

# Least-privilege baseline (#609). The publish job declares its own block
# (job-level permissions fully replace this one) with the OIDC-required
# id-token: write.
permissions:
  contents: read

jobs:
  publish:
    name: Build and publish to ${{ startsWith(github.ref_name, 'test-') && 'TestPyPI' || 'PyPI' }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: ${{ startsWith(github.ref_name, 'test-') && 'https://test.pypi.org/p/memtomem-stm' || 'https://pypi.org/p/memtomem-stm' }}
    permissions:
      id-token: write   # required for OIDC token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          python-version: "3.12"
      - name: Verify tag target and source versions
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$(git rev-list -n 1 "$GITHUB_REF_NAME")"
          uv run --frozen python -m memtomem_stm.release_check --tag "$GITHUB_REF_NAME"
      - name: Install locked development environment
        run: uv sync --frozen
      - name: Lint and typecheck exact tag
        run: |
          uv run ruff check src
          uv run ruff format --check src
          uv run mypy src
      - name: Test exact tag
        run: >-
          uv run pytest
          -m "not bench_qa_meta and not bench_qa_llm_judge and not bench_qa_sweep and not bench_qa_drift and not bench_qa_perf"
          --tb=short -q
      - name: Run tutorial notebook
        run: >-
          uv run pytest --nbmake notebooks/01_quickstart_proxy_setup.ipynb
          --nbmake-timeout=180 --tb=short -q
      - name: Audit locked runtime dependencies
        run: scripts/audit-dependencies.sh runtime
      - name: Audit locked optional extras
        run: scripts/audit-dependencies.sh extras
      - name: Build distribution
        run: uv build
      - name: Verify wheel and sdist metadata
        run: >-
          uv run --frozen python -m memtomem_stm.release_check
          --tag "$GITHUB_REF_NAME" --dist dist
      - name: Clean-install wheel and smoke all entry points
        shell: bash
        run: |
          set -euo pipefail
          uv venv /tmp/memtomem-stm-release-smoke
          uv pip install --python /tmp/memtomem-stm-release-smoke/bin/python dist/*.whl
          /tmp/memtomem-stm-release-smoke/bin/python -c \
            'import importlib.metadata as m; import memtomem_stm as p; assert m.version("memtomem-stm") == p.__version__'
          for entrypoint in mms memtomem-stm memtomem-stm-proxy; do
            "/tmp/memtomem-stm-release-smoke/bin/$entrypoint" --version
            "/tmp/memtomem-stm-release-smoke/bin/$entrypoint" --help >/dev/null
          done
      - name: Publish to PyPI
        if: ${{ !startsWith(github.ref_name, 'test-') }}
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist
      - name: Publish to TestPyPI
        if: ${{ startsWith(github.ref_name, 'test-') }}
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist
          # Dry-run lane only (#953). A dry run gets attempted more than once
          # for one version — a re-run after a lost response, a re-pushed
          # `test-v*` tag — and TestPyPI already holds those filenames, so
          # without this the job can never go green again. It SKIPS them:
          # publishing a changed build needs a new version, since
          # `release_check` ties the tag to pyproject. The PyPI step above
          # keeps failing on a re-upload on purpose: for a real release an
          # existing file means the version was already published, and the
          # publisher refusing it is the only thing that says so — the
          # verification steps above check the local tag, sources and built
          # metadata, never the index.
          skip-existing: true

  # The Release object was forgotten three times (v0.1.3, v0.2.0, v0.4.0) while
  # the tag and the PyPI upload went out fine, leaving `gh release list` showing
  # an older release as Latest — for ten days after v0.2.0. Writing the step down
  # somewhere did not stop the third one, so the workflow does it.
  #
  # Its own job rather than a step in `publish`: job-level `permissions` fully
  # replace the workflow-level block, so folding this in would hand
  # `contents: write` to the job that also holds the OIDC token. Kept apart,
  # `publish` keeps `id-token` only and this one takes `contents` only (#609).
  #
  # The body is deliberately minimal — install line plus a CHANGELOG link pinned
  # at the tag. What makes a good release note (why this is a minor, what to read
  # first) is a judgement no template makes well, so a human enriches it after the
  # fact with `gh release edit --notes-file`. This guarantees the object EXISTS
  # and points at the notes, never that it carries the final prose.
  github_release:
    name: Create the GitHub Release
    needs: publish
    # Production tags only. `test-v*` are TestPyPI dry runs and have never had a
    # Release; creating one would put a dry run at the top of the releases page.
    if: ${{ !startsWith(github.ref_name, 'test-') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create the Release if one does not already exist
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release $TAG already exists — leaving its notes alone."
            exit 0
          fi
          # Built in a variable, not inline: a quoted multi-line argument would
          # carry this file's YAML indentation into the body, and four leading
          # spaces turn the fenced block into an indented one.
          notes=$(printf '%s\n' \
            "memtomem-stm ${TAG#v}" \
            "" \
            '```bash' \
            "uv tool install --force memtomem-stm     # or: pip install -U memtomem-stm" \
            '```' \
            "" \
            "Release notes: [CHANGELOG.md](https://github.com/$REPO/blob/$TAG/CHANGELOG.md)")
          # --verify-tag: without it `gh release create` INVENTS a tag that does
          # not exist, so a bad ref becomes a ghost tag instead of an error.
          #
          # --latest matches every release so far, which have gone out in
          # increasing order. A backport (a v0.3.1 cut after v0.4.0) would take
          # the Latest badge it should not have; fix that one with
          # `gh release edit <tag> --latest=false` rather than teaching this
          # step to compare versions.
          gh release create "$TAG" --repo "$REPO" \
            --title "$TAG" --latest --verify-tag --notes "$notes"
