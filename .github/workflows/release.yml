name: Publish

# Publishes the memtomem-stm distribution to PyPI (or TestPyPI for dry-runs)
# via PyPI Trusted Publishers (OIDC). No API tokens are stored.
#
# Tag conventions:
#   v0.1.0          → PyPI                (production)
#   test-v0.1.0a1   → TestPyPI            (dry run)
#
# Both paths share the same `pypi` GitHub environment, gated to tag
# pushes matching `v*` and `test-v*` only.
#
# Build and publish run in a single job — actions/upload-artifact@v4
# scopes artifacts per run-attempt, so a partial rerun cannot reuse the
# previous attempt's build artifact. Keeping everything in one job means
# every (re)run rebuilds locally and avoids the cross-attempt artifact
# lookup entirely.

on:
  push:
    tags:
      - "v[0-9]*"        # production
      - "test-v[0-9]*"   # TestPyPI dry-run

# Least-privilege baseline (#609). The publish job declares its own block
# (job-level permissions fully replace this one) with the OIDC-required
# id-token: write.
permissions:
  contents: read

jobs:
  publish:
    name: Build and publish to ${{ startsWith(github.ref_name, 'test-') && 'TestPyPI' || 'PyPI' }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: ${{ startsWith(github.ref_name, 'test-') && 'https://test.pypi.org/p/memtomem-stm' || 'https://pypi.org/p/memtomem-stm' }}
    permissions:
      id-token: write   # required for OIDC token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "latest"
      - name: Audit locked runtime dependencies
        run: scripts/audit-dependencies.sh runtime
      - name: Audit locked optional extras
        run: scripts/audit-dependencies.sh extras
      - name: Build distribution
        run: uv build
      - name: Publish to PyPI
        if: ${{ !startsWith(github.ref_name, 'test-') }}
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist
          skip-existing: true
      - name: Publish to TestPyPI
        if: ${{ startsWith(github.ref_name, 'test-') }}
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist
          skip-existing: true
