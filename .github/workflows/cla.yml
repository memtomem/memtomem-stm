name: CLA Assistant

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

# Explicit permissions — repository default may be read-only.
permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  CLAAssistant:
    runs-on: ubuntu-latest
    steps:
      # The action's `lock-pullrequest-aftermerge` input defaults to true, and
      # it locks on the `closed` event without asking whether the PR was
      # merged. A plain close — reopened seconds later to retrigger CI, say —
      # therefore locked the conversation for good, and the next job that
      # posts a PR comment failed with "issue is locked" (HTTP 403). Skip the
      # action entirely on a close that is not a merge: the lock still lands
      # on real merges, where it does what it is for, keeping contributors
      # from revoking their signature comments afterwards.
      - name: "CLA Assistant"
        if: >-
          (github.event.comment.body == 'recheck' ||
           github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') ||
          (github.event_name == 'pull_request_target' &&
           (github.event.action != 'closed' || github.event.pull_request.merged == true))
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          # Signatures live on the unprotected `cla-signatures` branch, so the
          # built-in GITHUB_TOKEN can push directly. No admin PAT bypass or
          # remote-* pinning needed — see #89 for the prior two-layer setup
          # that this migration replaces.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: 'signatures/v1/cla.json'
          path-to-document: 'https://github.com/memtomem/memtomem-stm/blob/main/CLA.md'
          branch: 'cla-signatures'
          allowlist: dependabot[bot],memtomem
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          custom-notsigned-prcomment: |
            Thank you for your contribution! Before we can merge, please sign the [Contributor License Agreement](https://github.com/memtomem/memtomem-stm/blob/main/CLA.md).

            To sign, comment on this pull request with the statement below. You only need to sign once per GitHub account.
          custom-allsigned-prcomment: 'All contributors have signed the CLA. ✍️ ✅'
