# Automated dependency update PRs (#609). Actions are SHA-pinned in the
# workflows; Dependabot updates the pinned SHA and its trailing version
# comment together. Minor/patch updates are grouped to limit PR noise;
# major bumps arrive as individual PRs.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python-minor-patch:
        update-types: ["minor", "patch"]
    # mcp 2.0 removed `streamablehttp_client` and `mcp.server.fastmcp`, both
    # imported at module scope here, so the requirement is capped at `<2`
    # (#802). This updater edits the manifest, so it read that cap as a
    # constraint to widen and proposed `<3` within hours — see the closed
    # PR #805, whose lockfile moved to mcp 2.0.0 and failed 8 CI jobs. The
    # cap is deliberate, not stale; drop this ignore as part of the #801
    # migration that makes 2.x actually work.
    ignore:
      - dependency-name: "mcp"
        update-types: ["version-update:semver-major"]
