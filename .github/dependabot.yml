# Automated dependency update PRs (#609). Actions are SHA-pinned in the
# workflows; Dependabot updates the pinned SHA and its trailing version
# comment together. Minor/patch updates are grouped to limit PR noise;
# major bumps arrive as individual PRs.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    # Keep declared requirements where they are: a release the requirement
    # already admits only moves uv.lock. With the default ("auto"), the uv
    # updater raised each requirement it touched to the newest release
    # (#1304), so runtime floors in the published wheel would follow every
    # routine refresh. A release outside a requirement (an `mcp` 3.x past
    # `<3`, a new `pip-audit` past its `==` pin) still changes it and arrives
    # as a PR; "lockfile-only" would drop that update without a PR. This
    # setting also governs security updates: a fix the requirement already
    # admits moves uv.lock only, so the published runtime floor still needs
    # review and a manual raise (#737).
    versioning-strategy: "increase-if-necessary"
    groups:
      python-minor-patch:
        update-types: ["minor", "patch"]
    # The `mcp` major-version ignore added in #807 is gone: it existed only to
    # stop this updater widening the deliberate `<2` cap (PR #805 did exactly
    # that and failed 8 CI jobs), and #801 migrated the package to the 2.0
    # SDK. A future mcp major should surface as a PR again, not be silently
    # withheld — it needs review, not suppression, because the proxy rides SDK
    # internals in `proxy/_fastmcp_compat.py`.
